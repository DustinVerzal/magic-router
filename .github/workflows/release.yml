name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    # ponytail: bot commit carries [skip ci]; GITHUB_TOKEN pushes don't retrigger workflows anyway
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # ponytail: admin-owned PAT so the bump push can bypass the main ruleset; GITHUB_TOKEN cannot
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Bump version
        run: |
          # feat: -> minor, "!" or BREAKING -> major, anything else -> patch
          range="${{ github.event.before }}..${{ github.sha }}"
          git rev-parse "${{ github.event.before }}" >/dev/null 2>&1 || range="${{ github.sha }}"
          msgs=$(git log --format=%B "$range")
          f=.claude-plugin/plugin.json
          IFS=. read -r maj min pat <<<"$(jq -r .version $f)"
          if   grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING' <<<"$msgs"; then maj=$((maj+1)); min=0; pat=0
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$msgs";            then min=$((min+1)); pat=0
          else pat=$((pat+1)); fi
          v="$maj.$min.$pat"
          jq --arg v "$v" '.version=$v' $f > $f.tmp && mv $f.tmp $f
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"
