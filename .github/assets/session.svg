    @keyframes fill { from { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .row, .pip { animation: none } }
  </style>
  <rect x=".5" y=".5" width="919" height="353" rx="12" fill="#121214" stroke="#2a2a30"/>
  <g class="row" style="animation-delay:0.25s">
    <text x="36" y="46" fill="#8f8f99">›</text>
    <text x="51.6" y="46" fill="#e8e6e3">Design a sharded job queue for the worker fleet and write up the plan before touching code</text>
    <rect x="26" y="59" width="868" height="27" rx="6" fill="#1b1b20"/>
    <text x="51.6" y="77" fill="#e8e6e3" font-weight="700">router</text>
