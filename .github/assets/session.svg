<svg xmlns="http://www.w3.org/2000/svg" width="920" height="354" viewBox="0 0 920 354" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
  <title>model-router in one session</title>
  <style>
    .row { animation: rise .7s cubic-bezier(.16,1,.3,1) backwards }
